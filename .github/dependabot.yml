# Dependabot updates for the workflow actions and npm packages, with a 7-day cooldown.
# Files copied from luminare-dev/oss-template are excluded (hash-pinned in tests/test_template_copies.py).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:   # template copies; see the header
      - .github/workflows/pr-title.yml
      - .github/workflows/scorecard.yml
      - .github/workflows/reusable-ci.yml
      - .github/workflows/reusable-gitleaks.yml
      - .github/workflows/reusable-scorecard.yml
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Expo pins these (node_modules/expo/bundledNativeModules.json); they move together with the
      # SDK via "npx expo install --fix", not through Dependabot. Minor or even patch bumps outside
      # the SDK's range make "expo install --check" and npm ci fail.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Exact pins in the SDK: any version change, patch included, breaks the check.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-test-renderer"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
